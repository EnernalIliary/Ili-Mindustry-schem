<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蓝图库 · 近海小屿</title>
<meta name="description" content="Mindustry 蓝图收藏，可直接复制到游戏里使用。">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="back" href="https://iliary.life" title="返回主站">← 近海小屿</a>
    <h1>蓝图库</h1>
    <p class="sub">Mindustry 蓝图收藏。点开任意一张，复制那串字符，回游戏里 <kbd>Ctrl</kbd>+<kbd>V</kbd> 粘贴即可。</p>
  </div>
</header>

<main class="wrap">
  <div class="toolbar">
    <input id="search" type="search" placeholder="搜索名称、描述、标签…" autocomplete="off" spellcheck="false">
    <div id="tags" class="tags" role="group" aria-label="标签筛选"></div>
  </div>

  <p id="meta" class="meta"></p>
  <div id="grid" class="grid" aria-live="polite"></div>
  <p id="empty" class="empty" hidden>没有匹配的蓝图。</p>
</main>

<footer class="foot wrap">
  <span id="stamp"></span>
  <span>数据来自 git 仓库，push 后自动更新。</span>
</footer>

<div id="modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <button id="close" class="close" aria-label="关闭">×</button>
    <div id="m-preview" class="m-preview"></div>
    <h2 id="m-title"></h2>
    <p id="m-desc" class="m-desc"></p>
    <dl id="m-stats" class="stats"></dl>
    <div id="m-tags" class="tags small"></div>
    <div class="actions">
      <button id="m-copy" class="btn primary">复制蓝图</button>
      <a id="m-download" class="btn" download>下载 .msch</a>
      <a id="m-source" class="btn ghost" target="_blank" rel="noopener">在仓库查看</a>
    </div>
    <p id="m-hint" class="hint"></p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
